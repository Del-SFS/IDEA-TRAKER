
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEA TRACKER</title>

<style>
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #238636;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #010409;
    border-bottom: 1px solid var(--border);
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

header h2 {
    margin: 0;
    font-size: 18px;
}

header span {
    color: var(--muted);
    font-size: 12px;
}

.container {
    width: 90%;
    max-width: 800px;
    margin: 55px auto;
}

.heading {
    margin-bottom: 25px;
}

.heading h1 {
    font-size: 30px;
    margin: 0;
}

.heading p {
    color: var(--muted);
    margin-top: 8px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    min-height: 220px;
}

.panel-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.idea-name {
    font-size: 27px;
    margin: 12px 0;
    color: var(--accent);
}

.idea-description {
    color: #c9d1d9;
    line-height: 1.7;
    white-space: pre-wrap;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
}

button, .file-label {
    cursor: pointer;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #212830;
    color: var(--text);
    font-size: 14px;
    transition: .2s;
}

button:hover, .file-label:hover {
    border-color: var(--accent);
}

.primary {
    background: var(--green);
    border-color: #2ea043;
}

.primary:hover {
    background: #2ea043;
}

.complete {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
    padding: 15px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 7px;
}

.complete input {
    width: 19px;
    height: 19px;
    accent-color: #2ea043;
    cursor: pointer;
}

.complete label {
    cursor: pointer;
    font-size: 14px;
}

.stats {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 7px;
    flex: 1;
    min-width: 120px;
}

.stat strong {
    display: block;
    font-size: 22px;
}

.stat small {
    color: var(--muted);
}

.status {
    color: var(--muted);
    font-size: 12px;
    margin-top: 18px;
    min-height: 18px;
}

.empty {
    text-align: center;
    padding: 35px 10px;
    color: var(--muted);
}

.empty h2 {
    color: var(--text);
}

footer {
    margin-top: auto;
    padding: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 12px;
}

@media(max-width: 600px) {
    .container {
        margin: 30px auto;
    }

    .panel {
        padding: 20px;
    }

    .heading h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h2>💡 IDEA TRACKER</h2>
    <span>v1.0.0</span>
</header>

<main class="container">

    <div class="heading">
        <h1>Suas ideias.</h1>
        <p>Uma ideia de cada vez. Um projeto de cada vez.</p>
    </div>

    <div class="actions" style="margin-bottom:20px">
        <button class="primary" onclick="openJSON()">
            📂 Abrir ideias.json
        </button>

        <button onclick="selectRandom()">
            🎲 Outra ideia
        </button>

        <button onclick="downloadJSON()">
            ↓ Exportar JSON
        </button>

        <input
            type="file"
            id="fileInput"
            accept=".json,application/json"
            hidden
            onchange="loadFallback(event)"
        >
    </div>

    <section class="panel" id="ideaPanel">
        <div class="empty">
            <h2>💭 Nenhuma ideia carregada</h2>
            <p>Abra seu arquivo JSON para começar.</p>
        </div>
    </section>

    <div class="stats">
        <div class="stat">
            <strong id="total">0</strong>
            <small>Ideias restantes</small>
        </div>

        <div class="stat">
            <strong id="completed">0</strong>
            <small>Concluídas nesta sessão</small>
        </div>
    </div>

    <div class="status" id="status">
        Aguardando arquivo...
    </div>

</main>

<footer>
    IDEA TRACKER · Personal productivity tool
</footer>

<script>
let ideas = [];
let currentIdea = null;
let completed = 0;
let fileHandle = null;

const panel = document.getElementById("ideaPanel");
const statusText = document.getElementById("status");

function updateStats() {
    document.getElementById("total").textContent = ideas.length;
    document.getElementById("completed").textContent = completed;
}

function showIdea(idea) {
    currentIdea = idea;

    panel.innerHTML = `
        <div class="panel-label">IDEIA SELECIONADA</div>

        <h2 class="idea-name"></h2>

        <p class="idea-description"></p>

        <div class="complete">
            <input type="checkbox" id="done">
            <label for="done">
                Marcar esta ideia como concluída
            </label>
        </div>
    `;

    panel.querySelector(".idea-name").textContent = idea.nome;
    panel.querySelector(".idea-description").textContent =
        idea.descricao || idea.description || "Sem descrição.";

    document.getElementById("done").addEventListener(
        "change",
        completeIdea
    );
}

function selectRandom() {
    if (ideas.length === 0) {
        showEmpty();
        return;
    }

    let available = ideas.filter(
        idea => idea !== currentIdea
    );

    if (available.length === 0) {
        available = ideas;
    }

    const randomIndex = Math.floor(
        Math.random() * available.length
    );

    showIdea(available[randomIndex]);
}

async function completeIdea() {
    if (!currentIdea) return;

    const finished = currentIdea;

    ideas = ideas.filter(
        idea => idea !== finished
    );

    completed++;

    currentIdea = null;
    updateStats();

    statusText.textContent = "Salvando alterações...";

    if (fileHandle) {
        try {
            await saveToFile();
            statusText.textContent =
                "✓ JSON atualizado com sucesso!";
        } catch (error) {
            statusText.textContent =
                "Não foi possível salvar automaticamente. Use Exportar JSON.";
            console.error(error);
        }
    } else {
        downloadJSON();

        statusText.textContent =
            "JSON atualizado baixado. Substitua o arquivo antigo pelo novo.";
    }

    selectRandom();
}

function showEmpty() {
    currentIdea = null;

    panel.innerHTML = `
        <div class="empty">
            <h2>🎉 Tudo concluído!</h2>
            <p>Não existem mais ideias pendentes no seu JSON.</p>
        </div>
    `;
}

function validateJSON(data) {
    if (!data || !Array.isArray(data.ideias)) {
        throw new Error(
            'O JSON precisa conter uma lista chamada "ideias".'
        );
    }

    for (const idea of data.ideias) {
        if (!idea || typeof idea.nome !== "string") {
            throw new Error("Uma ideia está sem o campo nome.");
        }
    }

    return data.ideias;
}

async function openJSON() {
    if ("showOpenFilePicker" in window) {
        try {
            const [handle] = await window.showOpenFilePicker({
                types: [{
                    description: "Arquivo JSON",
                    accept: {
                        "application/json": [".json"]
                    }
                }],
                multiple: false
            });

            const file = await handle.getFile();
            const data = JSON.parse(await file.text());

            ideas = validateJSON(data);
            fileHandle = handle;
            completed = 0;

            updateStats();
            selectRandom();

            statusText.textContent =
                "✓ Arquivo aberto. Alterações serão salvas nele.";

        } catch (error) {
            if (error.name !== "AbortError") {
                alert("Erro ao abrir JSON: " + error.message);
            }
        }
    } else {
        document.getElementById("fileInput").click();
    }
}

async function loadFallback(event) {
    const file = event.target.files[0];

    if (!file) return;

    try {
        const data = JSON.parse(await file.text());

        ideas = validateJSON(data);
        fileHandle = null;
        completed = 0;

        updateStats();
        selectRandom();

        statusText.textContent =
            "Arquivo carregado. As alterações serão exportadas para um novo JSON.";

    } catch (error) {
        alert("Erro ao ler JSON: " + error.message);
    }

    event.target.value = "";
}

async function saveToFile() {
    const data = JSON.stringify(
        { ideias: ideas },
        null,
        4
    );

    const writable = await fileHandle.createWritable();

    await writable.write(data);
    await writable.close();
}

function downloadJSON() {
    const data = JSON.stringify(
        { ideias: ideas },
        null,
        4
    );

    const blob = new Blob(
        [data],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "ideias.json";

    link.click();

    URL.revokeObjectURL(url);
}

updateStats();
</script>

</body>
</html>
